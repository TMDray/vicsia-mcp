[project]
name = "vicsia-studio-mcp"
version = "1.3.9-beta.11"  # remplacé automatiquement par le workflow CI
description = "MCP server for Vicsia Studio — control your voice agents from Claude"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "claude", "voice", "agents", "accessibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0",
    "aiohttp>=3.9.0",
    "pyperclip>=1.8.0",
    "pyautogui>=0.9.54",
]

[project.urls]
Homepage = "https://github.com/TMDray/vicsia-mcp"
Repository = "https://github.com/TMDray/vicsia-mcp"

[project.scripts]
vicsia-studio = "vicsia_studio_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vicsia_studio_mcp"]
